<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/newral-favicon.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Primary SEO — this block is replaced per route at build time by scripts/prerender.mjs -->
    <!--seo:start-->
    <title>Newral — UI/UX Design &amp; App Development Agency in Noida, Delhi NCR</title>
    <meta name="description" content="Newral is a Noida &amp; Delhi NCR based tech agency offering UI/UX design, graphic design, app development, web development and DevOps for startups and growing businesses." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://www.newral.in/" />
    <!--seo:end-->
    <meta name="author" content="Newral" />

    <!-- Local / geo targeting -->
    <meta name="geo.region" content="IN-UP" />
    <meta name="geo.placename" content="Noida, Delhi NCR" />
    <meta name="geo.position" content="28.6280;77.3649" />
    <meta name="ICBM" content="28.6280, 77.3649" />

    <!-- Open Graph / Twitter defaults (route-specific values are written by the prerenderer) -->
    <meta property="og:site_name" content="Newral" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Machine-readable summary for AI assistants (https://llmstxt.org) -->
    <link rel="alternate" type="text/plain" title="LLMs.txt" href="/llms.txt" />

    <meta name="theme-color" content="#2563EB" />

    <!-- Preload critical local font (Aeonik Regular) — avoids FOUT on first paint -->
    <link rel="preload" href="/fonts/Aeonik-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
    
    <!-- Preload LCP Hero Images — correct .webp paths matching assets.js -->
    <link rel="preload" as="image" href="/assets/e06f1ee1dbdc3c0071bcaaa40c94885039f10c93.webp" type="image/webp" media="(max-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/73b26bce1817a7bdbe7d5b4a3508e620d4ef23ad.webp" type="image/webp" media="(min-width: 769px)" fetchpriority="high" />

    <!-- Preload hero inline animation (WebP for modern browsers, GIF fallback) -->
    <link rel="preload" as="image" href="/assets/hero_inline.webp" type="image/webp" fetchpriority="high" />

    <!-- Preload VideoSection poster so it shows instantly (not a <link rel="preload as="video"> —
         browsers ignore video preloads on mobile; just preload the poster thumbnail) -->
    <link rel="preload" as="image" href="/assets/89882cd565da57a2292b79bc66bc4a33f62c6e64.webp" type="image/webp" />

    <!-- Preload the 3 unique logo images — tiny files (~2–3 KB each), appear right after the video -->
    <link rel="preload" as="image" href="/assets/2db09fd8a30c022f76d43d6204bacb4761fb36b6.webp" type="image/webp" />
    <link rel="preload" as="image" href="/assets/a1e0419105b9db5ae6455ee08ac4bc1faa354f27.webp" type="image/webp" />
    <link rel="preload" as="image" href="/assets/93a4eb3a20b9809d0102191ffc85deb7f16b5fc1.webp" type="image/webp" />

    <!-- Google Fonts: Instrument Serif (asynchronous load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
    </noscript>

    <!-- Fontshare: Satoshi (asynchronous load) -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preload" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" as="style" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" />
    </noscript>

    <!-- No-JS fallback: show prerendered content that entrance animations would otherwise keep hidden -->
    <noscript>
      <style>
        .reveal, .fade-text { opacity: 1 !important; transform: none !important; filter: none !important; }
        #root [style*="opacity:0"]:not([style*="height:0"]) { opacity: 1 !important; filter: none !important; transform: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
